workflows:
  ios-release:
    name: Tribe iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tribe.fitness
      vars:
        BUNDLE_ID: com.tribe.fitness
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.11.0

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Set environment variables
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_USDA_API_KEY=$VITE_USDA_API_KEY" >> .env
          echo "VITE_REVENUECAT_IOS_KEY=$VITE_REVENUECAT_IOS_KEY" >> .env

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set app version
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Set up keychain and signing
        script: |
          keychain initialize
          keychain add-certificates
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/tribe.mobileprovision"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          echo "Installed profile to $PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist ios/ExportOptions.plist \
            --archive-xcargs "DEVELOPMENT_TEAM=W64Y4S5KNG PROVISIONING_PROFILE=$PROFILE_UUID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
