workflows:
  ios-release:
    name: Tribe iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic

    environment:
      groups:
        - env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tribe.fitness
      vars:
        BUNDLE_ID: com.tribe.fitness
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.11.0

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Set environment variables
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_USDA_API_KEY=$VITE_USDA_API_KEY" >> .env
          echo "VITE_REVENUECAT_IOS_KEY=$VITE_REVENUECAT_IOS_KEY" >> .env

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set app version
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Set up keychain and signing
        script: |
          keychain initialize
          keychain add-certificates
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          PROFILE_PATH="$PROFILES_HOME/tribe.mobileprovision"
          echo "$PROVISIONING_PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          echo "Installed profile to $PROFILE_PATH"
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist ios/ExportOptions.plist \
            --archive-xcargs "DEVELOPMENT_TEAM=W64Y4S5KNG"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Tribe Android Release
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      groups:
        - env
      android_signing:
        - tribe_keystore
      vars:
        PACKAGE_NAME: com.tribe.gym
        VITE_REVENUECAT_ANDROID_KEY: $VITE_REVENUECAT_ANDROID_KEY
      node: 22.11.0

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Set environment variables
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_USDA_API_KEY=$VITE_USDA_API_KEY" >> .env
          echo "VITE_REVENUECAT_ANDROID_KEY=$VITE_REVENUECAT_ANDROID_KEY" >> .env

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor
        script: npx cap sync android

      - name: Set app version
        script: |
          cd android
          VERSION_CODE=$BUILD_NUMBER
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" app/build.gradle

      - name: Build Android
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
